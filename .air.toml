root = "."
tmp_dir = ".tmp/air"
env_files = []

[build]
cmd = "CGO_ENABLED=0 go build -o ./.tmp/air/website ./cmd/website"
entrypoint = ["./.tmp/air/website"]
include_dir = ["cmd", "internal"]
include_file = ["go.mod", "go.sum"]
include_ext = ["go"]
exclude_dir = [".tmp", "frontend", ".git"]
exclude_regex = ["_test\\.go"]
delay = 500
poll = true
poll_interval = 500
stop_on_error = true
send_interrupt = true
kill_delay = "10s"

[misc]
clean_on_exit = true
