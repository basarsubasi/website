version: "2"
sql:
  - engine: sqlite
    schema: database/migrations
    queries: database/queries/gallery
    gen:
      go:
        package: store
        out: gen/sqlc/gallery
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: sqlite
    schema: database/migrations
    queries: database/queries/blog
    gen:
      go:
        package: store
        out: gen/sqlc/blog
        emit_empty_slices: true
        omit_unused_structs: true
  - engine: sqlite
    schema: database/migrations
    queries: database/queries/storage
    gen:
      go:
        package: store
        out: gen/sqlc/storage
        emit_empty_slices: true
        omit_unused_structs: true
