sonar.organization=basarsubasi
sonar.projectKey=basarsubasi_website

# Use the explicit test paths
sonar.scanner.autoconfig.enabled=false
sonar.sources=.
sonar.exclusions=vendor/**,gen/**
sonar.tests=cmd,database,internal,tests,ui/tests
sonar.test.inclusions=**/*_test.go,ui/tests/**
sonar.go.coverage.reportPaths=coverage.out

# The .sql files are SQLite, not Oracle PL/SQL.
sonar.plsql.file.suffixes=pks,pkb,plsql
