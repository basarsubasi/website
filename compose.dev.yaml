services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    init: true
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      COOKIE_SECURE: "false"
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      HTTP_ADDR: ":8080"
      HTTP_MAX_REQUESTS: ${HTTP_MAX_REQUESTS:-32}
      HTTP_MAX_UPLOADS: ${HTTP_MAX_UPLOADS:-2}
      HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-128}
      DATABASE_PATH: /data/website.db
      RESTORE_TIMEOUT: ${RESTORE_TIMEOUT:-5m}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_PHOTOS_BUCKET: ${R2_PHOTOS_BUCKET:?Set R2_PHOTOS_BUCKET}
      R2_BLOG_BUCKET: ${R2_BLOG_BUCKET:?Set R2_BLOG_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
      R2_PHOTOS_PUBLIC_URL: ${R2_PHOTOS_PUBLIC_URL:?Set R2_PHOTOS_PUBLIC_URL}
      R2_BLOG_PUBLIC_URL: ${R2_BLOG_PUBLIC_URL:?Set R2_BLOG_PUBLIC_URL}
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - .:/app
      - dev-data:/data
      - go-modules:/go/pkg/mod
      - go-build:/root/.cache/go-build
      - dev-build:/app/.tmp
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/health"]
      interval: 3s
      timeout: 2s
      start_period: 60s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    init: true
    environment:
      API_PROXY_TARGET: http://backend:8080
      VITE_USE_POLLING: "true"
    ports:
      - "0.0.0.0:5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  dev-data:
  go-modules:
  go-build:
  dev-build:
  node-modules:
