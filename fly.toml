# Supply your app with scripts/deploy-fly.sh APP.
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

[env]
  HTTP_ADDR = "0.0.0.0:8080"
  DATABASE_PATH = "/data/website.db"
  FRONTEND_DIR = "/app/frontend"
  COOKIE_SECURE = "true"
  TRUST_FLY_PROXY = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    # First startup may spend up to 90 seconds importing the R2 backup.
    grace_period = "100s"

[[mounts]]
  source = "website_data"
  destination = "/data"
  initial_size = "2gb"
  snapshot_retention = 14

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
